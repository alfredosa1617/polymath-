server.port=8080

spring.application.name=polymath-vsn

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:polymathdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Security
polymath.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
polymath.jwt.expiration-ms=86400000

# Static resources
spring.web.resources.static-locations=classpath:/static/
